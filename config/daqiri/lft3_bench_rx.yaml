%YAML 1.2
# DAQIRI raw-ibverbs RX benchmark for one LFT3 RFSoC 4x2 board on the DGX Spark (channel stream only).
#   sudo /opt/lft3arth/pipeline/daqiri/build/examples/daqiri_bench_raw_gpudirect \
#        config/daqiri/lft3_bench_rx.yaml --seconds 30
# Expect ~915.5 kpps / ~60.5 Gb/s app rate. Watch `ethtool -S enp1s0f0np0 | grep rx_out_of_buffer` (should stay flat).
# Packets: 10.17.16.60:60000 -> 10.17.16.10:60000, 8256-B UDP payload, 8298-B frame.
# host_pinned: GB10 has no GPUDirect RDMA; the iGPU reads pinned host pages in place.
---
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    master_core: 5             # Cortex-X925 cores on this Spark: 5-9, 15-19
    debug: false
    log_level: "info"
    loopback: ""

    memory_regions:
    - name: "Chan_RX"
      kind: "host_pinned"
      affinity: 0
      num_bufs: 65536          # ~72 ms at 915.5 kpps
      buf_size: 8320           # frame 8298 B

    interfaces:
    - name: "rfsoc0"
      address: "0000:01:00.0"  # enp1s0f0np0
      rx:
        flow_isolation: true
        queues:
        - name: "chan_q"
          id: 0
          cpu_core: 6
          batch_size: 1024
          memory_regions:
            - "Chan_RX"
        flows:
        - name: "chan_flow"
          id: 1                  # flow ids must be non-zero (ibverbs engine)
          action:
            type: queue
            id: 0
          match:
            udp_src: 60000
            udp_dst: 60000

bench_rx:
- interface_name: "rfsoc0"
  queue_id: 0
  cpu_core: 7
