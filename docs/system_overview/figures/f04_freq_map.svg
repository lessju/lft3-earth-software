   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="360.72" y="48.091875" transform="rotate(-0 360.72 48.091875)">5120 … 8191</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start" x="9.18" y="92.304" transform="rotate(-0 9.18 92.304)">channel index k in the packets (6144)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(50.465039 117.691383)">k = 0 … 3071  (bindex b = 0, 1, 2)</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(42.426563 126.781031)">= bins 5120 … 8191 (negative offsets)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(274.760039 117.691383)">k = 3072 … 6143  (b = 3, 4, 5)</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(268.896563 126.781031)">= bins 0 … 3071 (positive offsets)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 35.496484)">RF(k) = −NCO + (k − 3072)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 45.181812)">         × 152.587890625 kHz</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 51.673)"/>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 63.616484)">NCO = −2031.25 MHz:</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 72.931812)">k = 0   → 1562.50 MHz</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 82.181812)">k = 3072 → 2031.25 MHz</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 91.431812)">k = 6143 → 2499.85 MHz</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 97.923)"/>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 109.214937)">ascending k = ascending RF</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 118.464937)">(confirmed by 125 MHz spurs</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(453.348 127.996484)">and a 1800 MHz test tone)</text>
   </g>
