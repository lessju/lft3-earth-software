   <g id="text_1">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(52.248344 30.574938)">lft3-pipeline run</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(55.669109 39.824938)">(Python, host)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(27.971719 49.074938)">plans + launches containers,</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(38.546203 58.324938)">status, metrics, NIC log</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #333333" x="181.044" y="13.764994" transform="rotate(-0 181.044 13.764994)">containers (image lft3-runtime), all --ipc=host, one set per link</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(198.163828 53.390562)">lft3-&lt;board&gt;-&lt;link&gt;-capture</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(212.174766 62.043219)">--net host, NET_RAW,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(204.041094 70.793219)">IPC_LOCK, /dev/infiniband</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(215.542422 79.640562)">cpuset = link cores</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(365.91125 53.188766)">…-spectrometer</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(356.28625 62.140562)">as you (uid + groups)</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(376.086953 71.366891)">--net none</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(355.916563 79.543219)">cpuset = reader_cpus</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(524.446016 53.390562)">…-dump</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(507.430547 61.938766)">as you, --net none</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(515.031016 70.890562)">trigger socket</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(498.145703 79.640562)">/dev/shm/...-dump.sock</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(219.179016 173.799938)">/dev/shm (host IPC namespace):  lft3-&lt;stream&gt; (control block)  ·  lft3-&lt;stream&gt;.sock (ring fd)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(324.089047 183.049938)">·  lft3-&lt;stream&gt;-dump.sock (triggers)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(284.702547 192.299938)">+ GPU: the ring's VMM allocation, imported by each reader</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(216.383063 264.326625)">logs: &lt;run_dir&gt;/&lt;stream&gt;-&lt;role&gt;.log</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(220.2885 273.42675)">status.jsonl, nic-&lt;link&gt;.csv, plan.txt</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(442.382625 259.92675)">lft3-pipeline status / trigger / stop</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(442.276875 268.92675)">lft3.ring (Python): reads /dev/shm</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(452.815313 277.92675)">Prometheus (--metrics-port)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(42.357375 124.81875)">start order: capture →</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(50.281313 133.81875)">wait for its ring →</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(68.04225 143.51625)">readers</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(81.72 149.832)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(47.229188 160.81875)">stop order: readers</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(42.051375 169.81875)">(close files) → capture</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(81.72 176.832)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(46.640813 188.148938)">Ctrl-C, --duration or</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(51.312938 196.81875)">lft3-pipeline stop</text>
   </g>
  </g>
 </g>
