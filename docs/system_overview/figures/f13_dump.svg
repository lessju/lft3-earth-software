   <g id="text_5">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(56.595375 172.95075)">GPU copies each block into a pinned host buffer</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(40.437 181.95075)">(7.5 GB/s of window in ~0.7 s; checked with the seqlock)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(316.518516 168.645562)">then written at NVMe speed (~2.8 s per 1 s window): one GUPPI RAW file</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(305.931016 177.395562)">per beam; each block = 80-character header cards + one beam of a ring block</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(385.648438 186.145562)">([channel][time][pol][re, im] int8)</text>
