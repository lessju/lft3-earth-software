   <g id="text_1">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2f6db0" x="13.644" y="24.09315" transform="rotate(-0 13.644 24.09315)">control plane: /dev/shm/lft3-&lt;stream&gt; (560 KB, fixed layout)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle" x="148.68" y="51.546762" transform="rotate(-0 148.68 51.546762)">header: layout, obs id, config hash, software, state</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle" x="148.68" y="73.722762" transform="rotate(-0 148.68 73.722762)">head = next seq · futex word · writer heartbeat</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle" x="148.68" y="95.898762" transform="rotate(-0 148.68 95.898762)">capture statistics (packets, blocks, loss, Gb/s)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle" x="148.68" y="118.074762" transform="rotate(-0 148.68 118.074762)">16 reader entries: name, cursor, lag, overruns, heartbeat</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle" x="148.68" y="137.478762" transform="rotate(-0 148.68 137.478762)">seqToSlot[4096]: which slot holds sequence n</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle" x="148.68" y="156.882762" transform="rotate(-0 148.68 156.882762)">slot metadata[S]: seq, block, t0, missing, NCO, UNIX t0</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2e8b3a" x="314.964" y="24.09315" transform="rotate(-0 314.964 24.09315)">data plane: CUDA VMM allocation (fd via .sock)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="334.773" y="89.172109" transform="rotate(-0 334.773 89.172109)">n−2</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="363.231" y="89.129453" transform="rotate(-0 363.231 89.129453)">n−1</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="391.689" y="88.58" transform="rotate(-0 391.689 88.58)">n</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="420.147" y="89.183281" transform="rotate(-0 420.147 89.183281)">write</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="562.437" y="89.125898" transform="rotate(-0 562.437 89.125898)">n−S+1</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="321.66" y="133.884" transform="rotate(-0 321.66 133.884)">slots fill in allocation order; each = 50.3 MB block [2][6144][1024][2] int8</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start" x="321.66" y="153.288" transform="rotate(-0 321.66 153.288)">green: published · teal: a reader's cursor · red: acquired by the writer (seq = invalid)</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2f6db0" x="9.18" y="197.64" transform="rotate(-0 9.18 197.64)">Writer (capture), never waits for readers:</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'" transform="translate(9.18 218.07593)">1  acquireSlot(): slot.seq ← invalid (release), before any GPU write</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'" transform="translate(9.18 227.238383)">2  scatter + zero-fill kernels; record CUDA event</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'" transform="translate(9.18 236.400836)">3  event done → slot metadata; slot.seq ← n; seqToSlot[n] ← slot; head ← n+1 (release); futex wake</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f8a83" x="9.18" y="275.256" transform="rotate(-0 9.18 275.256)">Reader (any process), lock-free:</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'" transform="translate(9.18 295.69193)">1  wait(n): futex until head &gt; n          (if n &lt; head − (S − 8): skip ahead, count overruns)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'" transform="translate(9.18 304.854383)">2  begin(n): slot = seqToSlot[n]; check slot.seq == n; copy metadata</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'" transform="translate(9.18 314.016836)">3  GPU work on the block; synchronise</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'" transform="translate(9.18 323.179289)">4  stillValid(n): slot.seq == n again? no → overrun, discard the result</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'" transform="translate(9.18 332.341742)">5  consumed(n+1): cursor, lag, heartbeat (lossless readers hold the writer back, synthetic/file only)</text>
   </g>
  </g>
 </g>
 <defs>
  <clipPath id="p4bad2b9bbf">
   <rect x="3.6" y="3.6" width="613.8" height="354.816"/>
