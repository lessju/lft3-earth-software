   <g id="text_1">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'" transform="translate(44.196438 108.607375)">browser</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'" transform="translate(25.514094 117.660281)">(canvas waterfall,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'" transform="translate(29.103313 126.871125)">strips, drift tool,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'" transform="translate(46.145125 136.660281)">marks)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2f6db0" x="136.404" y="24.09315" transform="rotate(-0 136.404 24.09315)">lft3-view (C++, on the Spark, token-protected HTTP :8687)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(173.410469 71.625562)">run catalog</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(159.872578 81.053687)">chains rotated files</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(161.543281 89.028219)">by lft3_timestamp</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(278.811875 72.303687)">HDF5 metadata +</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(280.689844 80.375562)">chunk index only</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(281.9225 89.028219)">(H5Dchunk_iter)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(399.397266 71.625562)">parallel pread +</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(399.202031 80.778609)">inflate/unshuffle</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(394.796406 89.125562)">per 64 Ki-ch chunk</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(194.999531 173.264687)">encode u16db:</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(191.442656 181.336562)">16-bit dB planes,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(190.090781 190.086562)">hi bytes RLE, gzip</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(188.647031 199.102891)">(2.2–2.7× smaller)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(355.755469 173.264687)">reduce to the screen tile:</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(361.389375 181.336562)">max / mean per pixel,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(373.017578 190.086562)">optional flatten</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'" transform="translate(361.944453 199.102891)">(vectorised, all cores)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(543.5595 104.70825)">FBH5 files</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(529.291687 113.01075)">spectra/&lt;board&gt;/</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(539.105063 122.01075)">+ quicklook/</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(540.934875 131.01075)">triggers.log</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(535.75425 139.910625)">known_rfi.json</text>
   </g>
   <g id="text_9">
