   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #2f6db0" transform="translate(9.18 106.213656)">DAQIRI worker</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #2f6db0" transform="translate(9.18 115.815219)">(core 6)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #2f6db0" transform="translate(9.18 156.109656)">capture thread</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #2f6db0" transform="translate(9.18 165.711219)">(core 7)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2e8b3a" x="9.18" y="210.806125" transform="rotate(-0 9.18 210.806125)">GPU</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2e8b3a" x="9.18" y="260.702437" transform="rotate(-0 9.18 260.702437)">ring slot</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f8a83" x="9.18" y="310.598437" transform="rotate(-0 9.18 310.598437)">readers</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="81.72" y="14.688" transform="rotate(-0 81.72 14.688)">time →  (one packet, then the block it belongs to; typical values at 60.8 Gb/s)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(96.228 58.604925)">frame arrives;</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(96.228 66.286675)">flow rule → RX queue</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(168.768 58.604925)">DMA into header</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(168.768 66.286675)">and payload buffers</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(191.088 100.819175)">burst complete:</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(191.088 108.500925)">1024 pkts ≈ 1.1 ms</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(191.088 116.182675)">(or 1 ms timeout)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(263.628 150.715175)">get_rx_burst: parse</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(263.628 158.396925)">headers, assembler</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(263.628 166.078675)">→ block + slot</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(341.748 158.396925)">sort jobs,</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(341.748 166.078675)">launch scatter</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(364.068 208.293425)">scatter kernel</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(364.068 215.974675)">≈ 83 µs</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(419.868 150.715675)">kernel done:</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(419.868 158.397425)">burst returned</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(419.868 166.078675)">to DAQIRI</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(419.868 258.188925)">payload now in</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(419.868 265.870675)">row t of the block</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(497.988 39.595625)">block complete</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(497.988 47.277375)">(6144 packets = 6.71 ms)</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(497.988 152.81325)">seal: zero-fill gaps</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(497.988 160.4945)">→ CUDA event</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(497.988 168.17625)">→ publish seq n</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(497.988 256.445875)">readable ~2 s, then the</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(497.988 264.127625)">slot is reused (seq n+S)</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(497.988 302.501)">spectrometer reads it</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(497.988 310.18275)">within ~1 ms (lag 0);</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(497.988 317.8645)">dump copies on trigger</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start" x="81.72" y="355.644" transform="rotate(-0 81.72 355.644)">A payload stays in DAQIRI's pinned buffer only until its burst's scatter kernel has run (~1–2 ms); its data then lives in the ring for ~2 s.</text>
   </g>
  </g>
 </g>
